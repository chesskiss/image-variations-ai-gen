[project]
name = "pose-variations"
version = "0.1.0"
description = "Pose variation generation web application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "fal-client>=0.6.0,<1.0.0",
  "pillow>=10.4.0,<12.0.0",
  "numpy>=1.26.0,<3.0.0",
  "opencv-python-headless>=4.10.0.84,<5.0.0",
  "imagehash>=4.3.1,<5.0.0",
  "prometheus-client>=0.21.1,<1.0.0",
  "ruff>=0.9.0,<1.0.0",
  "mypy>=1.12.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "respx>=0.22.0,<1.0.0",
  "pre-commit>=4.0.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "single_image_transform",
  "frame_extraction_stage",
  "frame_judge_stage",
  "orchestration_stage",
  "ui",
]

[tool.hatch.build.targets.sdist]
include = [
  "single_image_transform",
  "frame_extraction_stage",
  "frame_judge_stage",
  "orchestration_stage",
  "ui",
  "tests/run_modules/run_single_image_transform.py",
  "tests/run_modules/run_frame_judge_stage.py",
  "run_pose_pipeline_orchestrator.py",
  "README.md",
  "QUICK LAUNCH.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "storage",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = true
exclude = ["^storage/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
  "integration: Optional integration tests requiring external APIs",
  "slow: Slow tests requiring external tools or fixtures",
]

[tool.coverage.run]
source = ["single_image_transform", "frame_extraction_stage", "frame_judge_stage", "orchestration_stage", "ui"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
