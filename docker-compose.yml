services:
  ai-image-variations:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-image-variations:latest
    container_name: ai-image-variations
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./outputs:/app/outputs
    restart: unless-stopped
