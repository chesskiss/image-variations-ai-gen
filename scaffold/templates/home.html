<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoseVariations</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page-layout">
      <section class="card">
        <h1>PoseVariations</h1>
        <p class="muted-text">Upload one model photo, choose one pose preset, and run full pipeline.</p>

        {% if error_message %}
        <p class="error-text">{{ error_message }}</p>
        {% endif %}

        <form action="/run" method="post" enctype="multipart/form-data" class="vertical-form">
          <label for="uploaded_image_file">Model photo (JPEG or PNG)</label>
          <input
            id="uploaded_image_file"
            name="uploaded_image_file"
            type="file"
            accept="image/jpeg,image/png"
            required
          />

          <label for="selected_pose_preset_identifier">Pose preset</label>
          <select id="selected_pose_preset_identifier" name="selected_pose_preset_identifier" required>
            {% for pose_preset in available_pose_presets %}
            <option value="{{ pose_preset.pose_preset_identifier }}">
              {{ pose_preset.pose_preset_display_name }}
            </option>
            {% endfor %}
          </select>

          <button type="submit">Run Orchestrator</button>
        </form>
      </section>
    </main>
  </body>
</html>
