<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoseVariations</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page-layout">
      <section class="card">
        <h1>PoseVariations</h1>
        <p class="muted-text">Upload one model photo and choose exactly two pose presets.</p>

        <form action="/jobs" method="post" enctype="multipart/form-data" class="vertical-form" id="upload-form">
          <label for="uploaded_image_file">Model photo (JPEG or PNG)</label>
          <input id="uploaded_image_file" name="uploaded_image_file" type="file" accept="image/jpeg,image/png" required />

          <fieldset>
            <legend>Pose presets (pick exactly two)</legend>
            {% for pose_preset in available_pose_presets %}
            <label class="checkbox-row">
              <input
                type="checkbox"
                name="selected_pose_preset_identifiers"
                value="{{ pose_preset.pose_preset_identifier }}"
              />
              {{ pose_preset.pose_preset_display_name }}
            </label>
            {% endfor %}
          </fieldset>

          <button type="submit">Start Generation Job</button>
        </form>

        <p id="form-error" class="error-text" hidden>Please choose exactly two presets.</p>
      </section>
    </main>

    <script>
      const uploadForm = document.getElementById("upload-form");
      const formError = document.getElementById("form-error");

      uploadForm.addEventListener("submit", (event) => {
        const selectedPresetCount = document.querySelectorAll(
          "input[name='selected_pose_preset_identifiers']:checked"
        ).length;

        if (selectedPresetCount !== 2) {
          event.preventDefault();
          formError.hidden = false;
          return;
        }

        formError.hidden = true;
      });
    </script>
  </body>
</html>
